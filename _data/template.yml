# Color settings (hex codes without the leading #)
color:
  primary: 93a4b5         # accent: buttons, active nav item, timeline, card edges
  primary-dark: 6f8296    # button hover (must be dark enough for white text)
  secondary: e3e4e6       # light tint: nav hover text, timeline circles
  secondary-dark: 66545e  # body text and headings
  link: 4f6a85            # links in text (needs good contrast on white)
  dark: 222222            # navbar, footer, social icon circles
  muted: 777777           # small grey text

# Font Families
# Font options for the website
font:
  # Primary font used for headings and main text
  primary: '"Raleway", sans-serif, "Helvetica Neue", Helvetica, Arial, sans-serif'

  # Secondary font used for special elements or accents
  secondary: '"Nunito Sans", sans-serif, "Helvetica Neue", Helvetica, Arial, sans-serif'
