    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    <link rel="icon" type="image/png" href="{{ '/img/favicon.png' | relative_url }}">

    <!-- Icons: v6 brands (fa-brands fa-*) for social logos, v4 (fa fa-*) for UI icons -->
    <link rel="stylesheet" href="{{ '/css/font-awesome/css/fontawesome.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/css/font-awesome/css/brands.min.css' | relative_url }}">

    <link rel="stylesheet" href="{{ '/css/font-awesome/css/font-awesome.min.css' | relative_url }}">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
