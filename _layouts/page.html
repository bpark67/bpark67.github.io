<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body id="page-top" class="subpage">

  {% include nav.html %}

  <div class="page-header-band">
    <div class="container">
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
    </div>
  </div>

  <main class="page-content">
    <div class="container">
      <div class="row">
        <div class="col-md-10 col-md-offset-1">
          {{ content }}
        </div>
      </div>
    </div>
  </main>

  {% include footer.html %}
  {% include js.html %}

</body>

</html>
