<ul class="list-inline social-buttons">
    {% for network in site.social %}
    <li>
        <a href="{{ network.url }}" aria-label="{{ network.title }}" title="{{ network.title }}" target="_blank" rel="noopener">
            <i class="fa-brands fa-{{ network.icon }}"></i>
        </a>
    </li>
    {% endfor %}
</ul>
