- title: "Semiparametric Spatial Point Processes"
  image: "img/plot-semiparam.png"
  status: "Preprint"
  authors:
    - name: "X. Lin"
    - name: "B. Park"
      is_self: true
    - name: "C. Zahasky"
      link: "https://zahasky.geoscience.wisc.edu/"
    - name: "H. Kang"
      link: "https://pages.cs.wisc.edu/~hyunseung/"
  year: 2025
  journal: "arXiv"
  links:
    - title: "arXiv"
      url: "https://arxiv.org/abs/2410.04359"
  abstract: >
    We consider a general problem in spatial point processes: estimating and testing the relationship between the distribution of spatial point patterns and main "target" covariates while adjusting for auxiliary "nuisance" covariates. Existing solutions often require a fully parametric model for all covariates, which can be biased if the model is mis-specified. To this end, we propose semiparametric spatial point processes: a parametric component measures the relationship between the target covariates and the spatial point patterns, and a nonparametric component adjusts for the nuisance covariates. We propose a generalized profile pseudo-likelihood framework to estimate the parametric component. The proposed estimator is shown to be asymptotically normal for both Poisson and non-Poisson spatial point processes with log-linear intensities. We provide a consistent estimator of the asymptotic covariance matrix for valid inference. We also show how to compute the proposed estimator using existing R software developed for generalized partial linear models in i.i.d. settings.
We conclude with a simulation study to assess the finite-sample performance of our estimator and a data analysis examining the relationship between the spatial distribution of per- and polyfluoroalkyl substances (PFAS) and sources of PFAS, such as military bases, airports, and landfills, while accounting for other covariates. Compared to parametric spatial point processes, semiparametric spatial point processes provide potentially more robust estimates about the sources of PFAS and more nuanced intensity maps of PFAS.

- title: "Statistical Mapping of PFOA and PFOS in Groundwater Throughout the Contiguous United States"
  image: "img/plot-pfas.png"
  authors:
    - name: "B. Park"
      is_self: true
    - name: "H. Kang"
      link: "https://pages.cs.wisc.edu/~hyunseung/"
    - name: "C. Zahasky"
      link: "https://zahasky.geoscience.wisc.edu/"
  year: 2024
  journal: "Environmental Science and Technology"
  abstract: >
    Per-and polyfluoroalkyl substances (PFAS) are synthetic chemicals that are increasingly being
    detected in groundwater. The negative health consequences associated with human exposure to PFAS
    make it essential to quantify the distribution of PFAS in groundwater systems. Mapping PFAS
    distributions is particularly challenging because a national patchwork of testing and reporting
    requirements has resulted in sparse and spatially biased data. In this analysis, an
    Inhomogeneous Poisson Process (IPP) modeling approach is adopted from ecological statistics to
    continuously map PFAS distributions in groundwater across the contiguous United States. The
    model is trained on a unique dataset of 8,910 PFAS groundwater measurements, using combined
    concentrations of two PFAS analytes. The IPP model predictions are compared with results from
    random forest models to highlight the robustness of this statistical modeling approach on sparse
    datasets. This analysis provides a new approach to not only map PFAS contamination in
    groundwater but also prioritize future sampling efforts.
  links:
    - title: "Paper"
      url: "https://pubs.acs.org/doi/10.1021/acs.est.4c05616"
    - title: "Code"
      url: "https://github.com/bpark67/mapping-pfas"
    - title: "Supplementary figures"
      url: "https://bpark67.github.io/webmap-est/"
