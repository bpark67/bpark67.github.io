<!-- Contact / footer -->
<footer id="contact">
    <div class="container">
        <div class="row">
            <div class="col-md-6 footer-contact">
                <h3>Contact</h3>
                <p>{{ site.department }}<br>{{ site.institution }}<br>
                    <span class="footer-email">{{ site.email_display }}</span></p>
            </div>
            <div class="col-md-6 footer-social">
                {% include social.html %}
                <p class="copyright">&copy; {{ site.time | date: "%Y" }} {{ site.title }}</p>
            </div>
        </div>
    </div>
</footer>
