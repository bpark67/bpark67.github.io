# ---------------------------------------------------------------------------
# Site settings
# Most day-to-day edits happen in this file, in _data/publications.yml,
# and in _presentations/. See README.md for step-by-step instructions.
# ---------------------------------------------------------------------------
title: Bumjun Park
description: "Bumjun Park, Ph.D. student in Biostatistics at the University of Washington. Functional data analysis, neuroimaging, and spatial and environmental statistics."
url: "https://bumjunpark.com"
baseurl: ""
lang: en_US
# Email, encoded so it never appears as readable text in the page or this file.
# Visitors see it only after pressing and holding the button in the footer.
# To change it, run this (with your new address) and paste the output here:
#   python3 -c "import base64;print(base64.b64encode('you@example.edu'[::-1].encode()).decode())"
email_encoded: "dWRlLnd1QDc2a3JhcGI="
# Hidden decoy address for bots (never shown to people; see _includes/footer.html)
email_honeypot: "contact-admin@bumjunpark.com"
image: /img/about/me.jpg   # preview image when the site is shared on social media / Slack

# Shown in the header and under the About Me photo
position: Ph.D. Student
department: Department of Biostatistics
institution: University of Washington
photo: img/about/me.jpg

# Icons under the About Me photo and in the footer.
# `icon` is a Font Awesome brand icon name (https://fontawesome.com/search?ic=brands)
social:
  - title: LinkedIn
    icon: linkedin-in
    url: https://www.linkedin.com/in/bpark67/
  - title: GitHub
    icon: github-alt
    url: https://github.com/bpark67
  - title: ORCID
    icon: orcid
    url: https://orcid.org/0009-0008-0361-3810

# CV (PDF). Replace the file at this path when you update your CV.
cv: img/CV.pdf
cv_updated: April 2026   # update this when you replace the PDF

# Turn sections on/off. Set show_software to true once you have a package to list.
show_software: false

# Separate pages listed under a "Personal" menu in the navbar.
# Each page is a Markdown file in the repository root with `layout: page`.
# Leave the list empty to hide the menu.
personal_menu_title: Personal
personal_pages:
  - title: Reading
    url: /reading/

# Presentations & posters live in _presentations/ (one file each).
# output: false means they appear only on the home page, not as separate pages.
collections:
  presentations:
    output: false

# Build settings
markdown: kramdown
plugins:
  - jekyll-seo-tag

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor

google_analytics: G-9VNF2WQ0CZ
