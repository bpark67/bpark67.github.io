<!-- Presentations & posters: one file per item in _presentations/ -->
{% assign talks = site.presentations | sort: 'date' | reverse %}
<section id="portfolio" class="bg-light-gray">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">Presentations</h2>
            </div>
        </div>
        <div class="row portfolio-row">
            {% for talk in talks %}
            <div class="col-md-4 col-sm-6 portfolio-item">
                <a href="#modal-{{ talk.date | date: "%Y%m%d" }}-{{ talk.slug }}" class="portfolio-link" data-toggle="modal">
                    <div class="portfolio-hover">
                        <div class="portfolio-hover-content">
                            <i class="fa fa-plus fa-3x"></i>
                        </div>
                    </div>
                    <img src="{{ '/img/portfolio/' | append: talk.thumbnail | relative_url }}" class="img-responsive img-centered"
                        alt="{{ talk.category }}: {{ talk.title }}" loading="lazy">
                </a>
                <div class="portfolio-caption">
                    <span class="portfolio-category">{{ talk.category }}</span>
                    <h4>{{ talk.title }}</h4>
                    <p class="text-muted">{{ talk.date | date: "%B %Y" }}</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
