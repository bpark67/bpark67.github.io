<!-- Presentations & posters: one file per item in _presentations/ -->
{% assign talks = site.presentations | sort: 'date' | reverse %}
<section id="portfolio" class="bg-light-gray">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">Presentations</h2>
            </div>
        </div>
        <div class="talk-list">
            {% for talk in talks %}
            <a class="talk-card" href="#modal-{{ talk.date | date: '%Y%m%d' }}-{{ talk.slug }}" data-toggle="modal">
                <img class="talk-thumb" src="{{ '/img/portfolio/' | append: talk.thumbnail | relative_url }}"
                    alt="" loading="lazy" width="120" height="90">
                <span class="talk-text">
                    <span class="talk-meta">{{ talk.category }} · {{ talk.date | date: "%b %Y" }}</span>
                    <span class="talk-title">{{ talk.title }}</span>
                    <span class="talk-venue">{{ talk.venue }}</span>
                </span>
            </a>
            {% endfor %}
        </div>
    </div>
</section>
