<!-- CV: replace the PDF at `cv:` in _config.yml to update -->
<section id="cv">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">CV</h2>
                <p class="section-subheading text-muted">Last updated {{ site.cv_updated }}</p>
                <a class="btn btn-primary btn-lg" href="{{ site.cv | relative_url }}" target="_blank" rel="noopener">
                    <i class="fa fa-file-pdf-o"></i> Download CV (PDF)</a>
            </div>
        </div>
        <!-- Inline preview on larger screens only; phone browsers can't display embedded PDFs -->
        <div class="row hidden-xs hidden-sm">
            <div class="col-lg-12">
                <object class="cv-embed" data="{{ site.cv | relative_url }}" type="application/pdf"
                    aria-label="CV of {{ site.title }}">
                    <p class="text-center">Your browser can't show the PDF here.
                        <a href="{{ site.cv | relative_url }}">Open the CV</a> instead.</p>
                </object>
            </div>
        </div>
    </div>
</section>
