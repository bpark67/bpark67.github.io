<!-- Software: entries come from _data/software.yml; shown when show_software: true -->
<section id="software">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">Software</h2>
            </div>
        </div>
        {% for pkg in site.data.software %}
        <article class="pub-card">
            <div class="pub-body">
                <h3 class="pub-title">{{ pkg.name }}</h3>
                <p class="pub-venue">{{ pkg.description }}</p>
                {% if pkg.links %}
                <div class="pub-links">
                    {% for link in pkg.links %}
                    <a class="btn btn-xs btn-pub" href="{{ link.url }}" target="_blank" rel="noopener">{{ link.title }}</a>
                    {% endfor %}
                </div>
                {% endif %}
            </div>
        </article>
        {% endfor %}
    </div>
</section>
