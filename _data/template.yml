# Color settings: "Navy & Brass" palette (hex codes without the leading #)
color:
  primary: 2b4c7e         # accent: buttons, active nav item, timeline, card edges
  primary-dark: 1d3557    # button hover (must be dark enough for white text)
  secondary: e6c98f       # light tint: nav hover text, timeline circles
  secondary-dark: 22303f  # body text and headings
  link: 2b4c7e            # links in text (needs good contrast on white)
  dark: 14213d            # navbar, footer, social icon circles
  muted: 777777           # small grey text

# Font Families
# Font options for the website
font:
  # Primary font used for headings and main text
  primary: '"Raleway", sans-serif, "Helvetica Neue", Helvetica, Arial, sans-serif'

  # Secondary font used for special elements or accents
  secondary: '"Nunito Sans", sans-serif, "Helvetica Neue", Helvetica, Arial, sans-serif'
